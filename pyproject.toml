[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Allow direct references (needed for the spaCy model wheel URL below)
[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "myth-rpg"
version = "0.1.0"
description = "Mythology themed text RPG"
readme = "README.md"
authors = [
    { name = "voolyvex", email = "your.email@example.com" },
]
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # torch is left unpinned as to platform: the default PyPI wheel is CPU-only
    # and installs everywhere. A DirectML or CUDA build is an opt-in extra
    # (see [project.optional-dependencies]) rather than a hard requirement,
    # because pinning a Windows/AMD-specific variant here makes the project
    # uninstallable on Linux and therefore uninstallable in CI.
    "torch>=2.4.1",
    "torchvision>=0.19.1",
    # Use a newer Transformers compatible with BGE reranker and chat templates
    "transformers>=4.52.0,<4.53",
    "accelerate>=0.25.0",
    "sentencepiece>=0.1.99",
    # Ensure recent sentence-transformers for BGE models
    "sentence-transformers>=2.5.0",
    "chromadb>=0.4.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "einops>=0.7.0",
    "safetensors>=0.4.0",
    "rank_bm25>=0.2.2",
    "flashrank>=0.1.0",
    "spacy>=3.7.0,<3.9",
    "nltk>=3.8.1",
    "requests>=2.31.0",
    # EntityAgent calls spacy.load("en_core_web_sm"). Model weights are not on
    # PyPI, so they are declared here as a direct URL rather than left as an
    # undeclared post-install step.
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    # ruff replaces black and isort both: `ruff format` is black-compatible and
    # the `I` rules are isort. One tool, one config, and nothing to keep in
    # agreement. Listing all three only invites reaching for whichever comes to
    # mind first — see [tool.ruff] below for the settings.
    "ruff>=0.6.0",
    "mypy>=1.0.0",
]
# Windows + AMD GPU acceleration. Opt-in: torch-directml publishes no Linux
# wheels, so requiring it unconditionally breaks installation everywhere else.
directml = [
    "torch-directml==0.2.5.dev240914; platform_system == 'Windows'",
]
# CUDA-only performance extras. flash-attn builds from source and needs a CUDA
# toolchain (nvcc) present at install time, so it cannot be a base dependency
# on a machine without one — including CI runners.
cuda = [
    "flash-attn>=2.7.0",
    "kernels>=0.11.0",
]

[project.scripts]
myth-rpg = "god_chat:main"

# The project is a flat layout: top-level modules plus the agents/ and utils/
# packages. The previous `packages = ["god_chat"]` named a module, not a
# package, so no build target matched it.
[tool.hatch.build.targets.wheel]
packages = ["agents", "utils", "myth_eval"]
include = [
    "god_chat.py",
    "main.py",
    "rag_system.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "agents",
    "utils",
    "myth_eval",
    "god_chat.py",
    "main.py",
    "rag_system.py",
    "pyproject.toml",
    "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The heavy tests are opt-in: run them with `pytest -m heavy`. They must not be
# in the default run, because importing torch and chromadb into the process is
# exactly what the no-heavy-imports guards in test_runner and test_metrics
# assert has not happened — collecting both in one process fails those guards
# by collection order alone.
addopts = ["-m", "not heavy"]
markers = [
    # Tests that construct the real retrieval stack — torch, chromadb and a
    # sentence-transformers model. Deselect with -m "not heavy" on a machine
    # without the models. Everything else in the suite must stay free of them:
    # several tests assert the heavy modules are absent from sys.modules, so a
    # heavy test must import them inside the test body, never at module level.
    "heavy: requires the embedding model and vector store",
]

[tool.ruff]
# The default 88, kept explicit because it is a decision rather than an
# oversight: myth_eval/ and tests/ are already hand-wrapped to it, and a wider
# limit would have the formatter *un*-wrap that code into longer lines than
# anyone wrote by hand. target-version is deliberately absent — ruff reads it
# from requires-python above, and a second copy here could disagree with it.
line-length = 88

# .scratch/ holds the issue tracker (see AGENTS.md): specs and tickets, some
# carrying python in fenced blocks that ruff formats as if it were source.
# Prose about code is not code, and a ticket should read as it was written.
extend-exclude = [".scratch"]

[tool.ruff.lint]
# E and F are pyflakes plus the pycodestyle errors; I is isort, which is why
# isort is no longer a dependency. This is the floor, not a ceiling — the point
# is a set that runs clean enough to be worth reading, so a real finding is not
# buried in a few hundred stylistic ones. Widen it when the existing findings
# are paid down, not before.
select = ["E", "F", "I"]
# W and UP were considered and left out: a few hundred findings between them,
# almost entirely trailing whitespace and py3.9-era typing that the formatter
# has no opinion about. Neither is worth the noise until this set runs clean.
# The formatter owns line length. Leaving E501 on as well means a long line is
# reported by `ruff check` and then left alone by `ruff format`, which will not
# split a long string or comment — a report no tool here can act on.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These three extend sys.path, set TOKENIZERS_PARALLELISM and friends, and quiet
# the loggers *before* importing torch and transformers, which read that state at
# import time. The order is load-bearing, so the imports cannot all move to the
# top of the file — E402 here reports the design rather than a mistake.
"rag_system.py" = ["E402"]
"agents/dense_retriever.py" = ["E402"]
"agents/summarizer.py" = ["E402"]

[tool.uv]
# UV-specific settings can go here
